# The whole stack on one machine: PostgreSQL, Kafka, Keycloak, and the app.
#
#   docker compose up --build
#
# The app runs the prod profile: PostgreSQL store, Kafka read model, JWT security,
# and the rush demo switched off. To see the demo UI, run the app outside Docker
# with `turnstilectl up`.
#
# NOT RUN. Written without a working Docker daemon, so this file has been parsed
# and schema-checked but no container has ever been started from it.
#
# The passwords below are for a laptop. Change every one of them for anything else.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: turnstile
      POSTGRES_USER: turnstile
      POSTGRES_PASSWORD: dev-only-change-me
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U turnstile -d turnstile"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

  kafka:
    image: apache/kafka:3.7.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: dev-only-change-me
    volumes:
      - ./ops/keycloak/turnstile-realm.json:/opt/keycloak/data/import/turnstile-realm.json:ro
    ports:
      - "8081:8080"

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      keycloak:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: prod
      TURNSTILE_POSTGRES_URL: jdbc:postgresql://postgres:5432/turnstile
      TURNSTILE_POSTGRES_USER: turnstile
      TURNSTILE_POSTGRES_PASSWORD: dev-only-change-me
      TURNSTILE_KAFKA_ENABLED: "true"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_KAFKA_CONSUMER_AUTO_OFFSET_RESET: earliest
      TURNSTILE_OIDC_JWKS_URI: http://keycloak:8080/realms/turnstile/protocol/openid-connect/certs
    ports:
      - "8080:8080"

volumes:
  pgdata:

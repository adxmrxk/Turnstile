spring:
  application:
    name: turnstile
  threads:
    # Requires Java 21. Left off because the build currently targets 17; the
    # domain makes no thread-pool assumptions, so switching java.version to 21
    # and flipping this to true is the entire migration.
    virtual:
      enabled: false

turnstile:
  hold:
    # How long a buyer keeps a seat while payment runs. Evaluated at command
    # time against the clock, never by a scheduler, so correctness does not
    # depend on a sweeper firing punctually.
    ttl: PT2M

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
